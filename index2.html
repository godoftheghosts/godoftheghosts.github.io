<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Admission Form</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Comic Sans MS", "Poppins", sans-serif;
            background: linear-gradient(135deg, #ffd6e8, #d6f0ff);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #ff9a9e, #fad0c4);
            padding: 25px;
            text-align: center;
            color: #fff;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-top: 8px;
            font-size: 16px;
        }

        .form-area {
            padding: 30px;
        }

        .section-title {
            font-size: 22px;
            color: #ff6f91;
            margin-bottom: 15px;
            border-left: 6px solid #ff6f91;
            padding-left: 10px;
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .field {
            flex: 1 1 250px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #ff6f91;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        .cute-icons {
            text-align: center;
            font-size: 28px;
            margin: 20px 0;
        }

        .submit-btn {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background: linear-gradient(135deg, #ff6f91, #ff9671);
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: scale(1.05);
        }

        .footer {
            background: #f7f7f7;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌈 School Admission Form</h1>
        <p>Welcome to Bright Future School</p>
    </div>

    <div class="form-area">

        <div class="section-title">👧 Student Information</div>
        <div class="form-group">
            <div class="field">
                <label>Student Name</label>
                <input type="text" placeholder="Enter student name">
            </div>
            <div class="field">
                <label>Date of Birth</label>
                <input type="date">
            </div>
            <div class="field">
                <label>Class Applying For</label>
                <select>
                    <option>Select Class</option>
                    <option>Nursery</option>
                    <option>LKG</option>
                    <option>UKG</option>
                    <option>1st Grade</option>
                    <option>2nd Grade</option>
                </select>
            </div>
        </div>

        <div class="section-title">👨‍👩‍👧 Parent / Guardian Details</div>
        <div class="form-group">
            <div class="field">
                <label>Parent Name</label>
                <input type="text" placeholder="Enter parent name">
            </div>
            <div class="field">
                <label>Contact Number</label>
                <input type="tel" placeholder="Enter mobile number">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" placeholder="Enter email">
            </div>
        </div>

        <div class="section-title">🏡 Address</div>
        <div class="form-group">
            <div class="field">
                <label>Residential Address</label>
                <textarea placeholder="Enter full address"></textarea>
            </div>
        </div>

        <div class="cute-icons">
            🎒 📚 ✏️ 🧸 🌟
        </div>

        <div class="submit-btn">
            <button>Submit Admission</button>
        </div>
    </div>

    <div class="footer">
        © 2025 Bright Future School | Learning with Joy 💖
    </div>
</div>

</body>
</html>
